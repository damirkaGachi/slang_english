<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Переводчик с молодёжного: шпаргалка для взрослых</title>
<style>
*{box-sizing:border-box}
html{min-height:100%}
body{margin:0;min-height:100vh;background:linear-gradient(160deg,#0d1b4f 0%,#3a2a8c 55%,#b83e86 100%) no-repeat;background-attachment:fixed;color:#fff;font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
#app{max-width:1100px;margin:0 auto;padding:28px 24px 36px;min-height:100vh;display:flex;flex-direction:column;justify-content:center}
#head h1{font-size:32px;line-height:1.25;font-weight:600;text-align:center;margin:0 0 6px;transition:font-size .3s}
#head .sub{color:#ffd9ec;font-size:19px;text-align:center;margin:0 0 22px;transition:font-size .3s}
#head.big h1{font-size:60px}
#head.big .sub{font-size:28px;margin-bottom:48px}
button{font-family:inherit}
.btn{background:#fff;color:#2b1a5e;border:none;border-radius:12px;padding:14px 24px;font-size:18px;font-weight:600;cursor:pointer}
.btn:hover{background:#ffe9c7}
.btn2{background:rgba(255,255,255,.15);color:#fff}
.btn2:hover{background:rgba(255,255,255,.28)}
button:focus-visible,#card:focus-visible,.pile:focus-visible{outline:3px solid #fff;outline-offset:3px}
#start{display:flex;flex-direction:column;align-items:center;gap:14px}
#start .btn{padding:22px 56px;font-size:26px;border-radius:16px}
#start #fresh{padding:14px 32px;font-size:18px;display:none}
#play{display:none}
#tools{position:fixed;top:16px;right:16px;z-index:10;display:none;gap:10px}
#tools .btn{font-size:14px;padding:9px 14px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 320px minmax(0,1fr);gap:16px;align-items:start}
.col{text-align:center}
.lab{font-size:17px;margin-bottom:10px}
.pile{position:relative;width:140px;height:180px;margin:0 auto}
#slot{position:relative;width:320px;height:420px;border:2px dashed rgba(255,255,255,.3);border-radius:20px;transition:transform .35s ease}
#card{display:none;position:absolute;inset:-2px;perspective:1100px;cursor:pointer}
#inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
#inner.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:#F5A02A;color:#3A1B00;border:3px solid #FFD08A}
.back{transform:rotateY(180deg)}
.small{position:absolute;font-size:15px;opacity:.7}
#w{font-size:46px;font-weight:600;text-align:center;word-break:break-word}
.bw{text-align:center;padding-bottom:30px}
#txt{font-size:20px;line-height:1.45}
#exw{display:none;margin-top:14px;padding-top:12px;border-top:1px solid rgba(58,27,0,.3)}
#exw .l{display:block;font-size:13px;opacity:.7;margin-bottom:4px}
#ex{font-size:17px;font-style:italic;line-height:1.45}
.hbtn{position:absolute;right:14px;bottom:14px;background:#3A1B00;color:#FFD08A;border:none;border-radius:10px;padding:9px 15px;font-size:15px;cursor:pointer}
#result{display:none;position:absolute;inset:0;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;gap:8px}
#result .big{font-size:60px;font-weight:600}
#result .ttl{font-size:24px;font-weight:600}
#result .sm{font-size:17px;color:#ffd9ec}
#rbtns{display:flex;flex-direction:column;gap:10px;width:100%;margin-top:14px}
#hist{width:100%;max-width:280px;height:420px;background:#d9dadf;color:#23242b;border-radius:18px;padding:22px;opacity:0;transform:translateX(calc(var(--sh,0px)*-1 - 24px));transition:transform .35s ease,opacity .3s;pointer-events:none;overflow:auto}
#hist.on{opacity:1;transform:translateX(calc(var(--sh,0px)*-1));pointer-events:auto}
#hist .t{font-size:14px;color:#55575f;margin-bottom:12px}
#ht{font-size:19px;line-height:1.55}
#acts{visibility:hidden;display:flex;flex-direction:column;gap:12px;margin-top:56px}
#acts .btn{width:100%;font-size:20px;padding:16px 20px}
.row2{margin-top:12px}
#hint{text-align:center;font-size:18px;color:#ffd9ec;margin:22px 0 0}
@media (max-width:820px){
.grid{grid-template-columns:1fr}
#slot{margin:0 auto}
#hist{margin:0 auto}
#acts{margin:10px auto 0;max-width:320px}
#head h1{font-size:26px}
#head.big h1{font-size:40px}
#head.big .sub{font-size:20px}
#tools{position:static;justify-content:center;margin:0 0 14px}
}
@media (prefers-reduced-motion:reduce){
#slot,#inner,#hist{transition-duration:.01s}
}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div id="app">
<div id="head" class="big">
<h1>Переводчик с молодёжного</h1>
<p class="sub">Шпаргалка для взрослых</p>
</div>

<div id="start">
<button class="btn" id="go">Начать изучение</button>
<button class="btn btn2" id="fresh">Начать сначала</button>
</div>

<div id="play">
<div id="tools">
<button class="btn btn2" id="restart">↺ Начать сначала</button>
<button class="btn btn2" id="snd">♪ Звук: вкл</button>
</div>
<div class="grid">
<div class="col">
<div class="lab">Колода · <span id="dc">0</span></div>
<div class="pile" id="deck" tabindex="0" role="button" aria-label="Взять карточку из колоды"></div>
</div>
<div id="slot">
<div id="result">
<div class="big" id="rbig"></div>
<div class="ttl" id="rttl"></div>
<div class="sm" id="rsm"></div>
<div id="rbtns"></div>
</div>
<div id="card" tabindex="0" role="button" aria-label="Перевернуть карточку">
<div id="inner">
<div class="face"><div class="small" style="top:18px">Слово</div><div id="w"></div><div class="small" style="bottom:18px">нажми, чтобы перевернуть</div></div>
<div class="face back"><div class="small" style="top:18px">Значение</div>
<div class="bw"><div id="txt"></div><div id="exw"><span class="l">Пример</span><div id="ex"></div></div></div>
<button class="hbtn" id="hb"><span id="hbt">История</span></button></div>
</div>
</div>
</div>
<div id="hist"><div class="t">Историческая справка</div><div id="ht"></div></div>

<div class="col row2">
<div class="lab">Ещё повторить · <span id="ac">0</span></div>
<div class="pile" id="pa" tabindex="0" role="button" aria-label="Взять карточку из стопки «Ещё повторить»"></div>
</div>
<div id="acts">
<button class="btn" id="bk">✓ Знаю</button>
<button class="btn btn2" id="ba">↻ Ещё повторить</button>
</div>
<div class="col row2">
<div class="lab">Знаю · <span id="kc">0</span></div>
<div class="pile" id="pk" tabindex="0" role="button" aria-label="Взять карточку из стопки «Знаю»"></div>
</div>
</div>
<p id="hint">Нажми на колоду, чтобы взять карточку</p>
</div>
</div>

<script>

var CARDS=[
{word:"Заабузить",def:"Воспользоваться чем-либо в своих интересах",ex:"Он заабузил баг, чтобы выиграть",hist:"Слово происходит от английского abuse, которое означает “злоупотребление”. В русский язык оно пришло через интернет-среду: сначала употреблялось существительное “абуз”, которое означало сам факт злоупотребления. Затем оно трансформировалось в глагол “заабузить” - использовать недочёты игры для получения преимущества или ради развлечения"},
{word:"ИМХО",def:"По моему мнению",ex:"ИМХО этот фильм переоценён",hist:"Аббревиатура происходит от английского in my humble opinion — «по моему скромному мнению». В русский язык она пришла через интернет-среду в 1990–2000-х годах и сначала использовалась в сетевом общении как калька с английского. Однако со временем значение сместилось: если в английском выражение подчёркивает скромность говорящего и неуверенность в своей правоте, то в русском «ИМХО» чаще означает просто «по моему мнению» — иногда даже с оттенком категоричности"},
{word:"Юзабельно",def:"Пригодно к использованию; Можно использовать для решения тех или иных задач",ex:"Это приложение вполне юзабельно для кода",hist:"Слово образовано от английского use — «использовать» (через usable — «пригодный к использованию»). В русский язык оно пришло через интернет-среду и молодёжный сленг. Стоит отметить, что степень пригодности может быть разной: решение может хорошо подходить для конкретной задачи, а может быть лишь приемлемым в целом, уступая более эффективным альтернативам"},
{word:"Агриться",def:"Злиться, раздражаться, проявлять агрессию по отношению к кому-либо или чему-либо",ex:"Не агрись на то, что я не умею играть в волейбол",hist:"Слово пришло из геймерского сленга: в англоязычных онлайн-играх существовал глагол to aggro — привлечь агрессию противника, то есть вызвать врага на бой. В русской геймерской среде этот термин упростили до «агриться», а затем он вышел за рамки игр и закрепился в повседневной речи. Относительно происхождения слова есть разные версии. Одни полагают, что оно произошло от английского aggressive / aggression (агрессивный, агрессия), другие — от angry (сердитый)"},
{word:"Скуф",def:"Стереотипный образ мужчины средних лет с лишним весом, который ведёт малоподвижный образ жизни, не следит за собой и предпочитает диван и телевизор",ex:"В магазин зашёл скуф",hist:"Слово происходит от фамилии Алексея Скуфьина — модератора политического раздела имиджборда «Двач». В 2018 году он записал агрессивное видеообращение, после чего пользователи начали высмеивать его внешность, а его фамилия постепенно стала нарицательной. Позже слово вышло за пределы «Двача» и в 2021–2023 годах распространилось в широком интернете как мем, обозначающий неухоженного, консервативного мужчину, который «как-то сдал» с возрастом. Хотя обычно слово “скуф” используется в юмористическом ключе, иногда оно приобретает негативный окрас"},
{word:"Рофл",def:"Шутка, или реакция на что-то смешное",ex:"Вы не поняли, это рофл",hist:"Слово происходит от английской аббревиатуры ROFL (Rolling On the Floor Laughing — «катаюсь по полу от смеха»). Это сокращение появилось в интернет-общении в конце 1980-х годов и изначально использовалось как быстрая письменная реакция на смешной контент. В русский язык оно пришло через интернет-среду и со временем вышло за пределы переписки: сейчас «рофл» может означать и саму шутку, и лёгкое подшучивание, и реакция на смешную ситуацию"},
{word:"Альтушка",def:"Представительница альтернативной субкультуры, которую можно узнать по ярким волосам, вызывающему макияжу, тёмной или необычной одежде и обилию аксессуаров",ex:"Моя девушка похоже на альтушку",hist:"Слово образовано от английского alternative — «альтернативный». В русскоязычном сегменте интернета термин закрепился в 2020–2021 годах благодаря TikTok. Как и в случае со “скуфом”, слово “альтушка” может использоваться как в юмористическом ключе, так и в пренебрежительном: им стали называть девушек, которые, стремясь выделиться, на деле выглядят одинаково и копируют тренды. Слово вошло в число претендентов на победу в конкурсе «Слово года» в 2024 году"},
{word:"Тильт",def:"Состояние эмоционального истощения, возникающее после серии неудач или сильного разочарования",ex:"Этот парень ушёл в тильт",hist:"Слово пришло из среды игроков в пинбол: от английского tilt — «наклон». В современном сленге «быть в тильте» означает, что человек выбит из колеи и не может собраться с силами и что-либо делать"},
{word:"Сигма",def:"В молодёжном сленге так называют уверенного в себе, самодостаточного человека, который не стремится вписываться в социальную иерархию и не нуждается в одобрении окружающих",ex:"Он настолько уверен в себе, прям сигма",hist:"Термин sigma male в 2010 году предложил американский блогер Теодор Роберт Бил (Vox Day). В 2020–2022 годах слово стало вирусным в TikTok, а главным визуальным символом («сигма-фейс») стало выражение лица Патрика Бейтмана из «Американского психопата» . В 2024 году «сигма» вошло в тройку самых упоминаемых слов в соцсетях, а также в список популярных сленговых слов среди подростков по версии Oxford University Press"},
{word:"Нуб",def:"Неопытный новичок, чаще всего в компьютерных играх",ex:"Этот человек плохо играет, прям нуб",hist:"Слово пришло из английского newbie («новичок»), которое в геймерской среде трансформировалось в noob — с более пренебрежительным оттенком: если newbie просто неопытен и может научиться, то noob часто подразумевает упрямого новичка, который не хочет разбираться. В русский язык слово попало через игровой сленг, изначально как уничижительная характеристика неопытного игрока, а затем распространилось на повседневную речь. Сейчас «нуб» может звучать по-разному — от добродушного подшучивания до реального оскорбления, в зависимости от контекста"},
{word:"Гостинг",def:"Внезапное прекращение общения без объяснения причин",ex:"Мой парень меня загостил - ни сообщений, ничего больше",hist:"Слово происходит от английского ghosting (от ghost — «призрак»). В русскоязычном пространстве термин закрепился в 2020-х годах, хотя в английском стал популярен в середине 2010-х. Изначально гостинг описывал ситуацию в романтических отношениях или онлайн-знакомствах, но позже распространился на дружбу и даже работу (когда сотрудник перестаёт выходить на связь)"},
{word:"Пранк",def:"Розыгрыш, шутка, при которой человека ставят в неожиданную ситуацию",ex:"Пранк получился неудачным",hist:"Слово происходит от английского prank — «шалость, проказа, розыгрыш». В русский язык оно пришло через интернет-среду в 2010-х годах вместе с популярностью видеороликов-розыгрышей на YouTube. От слова образовались производные: пранкануть (разыграть кого-то), пранкер (тот, кто разыгрывает). Несмотря на то, что под пранком подразумевается безобидная шутка, иногда он может быть очень неприятным для того, кого пранкуют"},
{word:"Паль",def:"Низкокачественная подделка известного и дорогого бренда или вещи",ex:"Он носит паль, сразу видно",hist:"Слово образовано от разговорного «палёный» (в значении «поддельный, нелегальный») и его производного «палёнка» — так называли нелегальный или поддельный товар. В молодёжный сленг слово вошло в 2010-х годах и сократилось до «паль» и стало обозначать именно грубую, низкокачественную копию бренда, которую легко отличить от оригинала"},
{word:"ЧСВ",def:"Высокомерный, самовлюблённый человек",ex:"Он ЧСВ, думает только о себе",hist:"Изначально эта аббревиатура означает «чувство собственной важности». В русский язык она пришла в 1990-х годах из перевода книг Карлоса Кастанеды, где это понятие описывало качество, мешающее человеку жить и отнимающее у него энергию. Со временем слово приобрело негативный окрас, а затем значение сместилось: если раньше ЧСВ обозначало само качество («у него ЧСВ»), то позже так стали называть и самого человека — думающего только о себе и смотрящего на других свысока"},
{word:"Ультануть",def:"Сделать что-то невероятное, что-то, что шокирует других",ex:"Он написал экзамен на 5, вот это ультанул",hist:"Слово происходит из геймерского сленга: от английского ultimate skills («ультимативные навыки») — так в компьютерных играх называют самую мощную способность персонажа. В играх «ультануть» значит применить эту суперспособность в решающий момент, а в повседневной речи — сделать что-то из ряда вон выходящее, удивить или шокировать окружающих"},
{word:"Мета",def:"Наиболее эффективная стратегия на текущий момент",ex:"Наша стратегия по подготовке к экзамену - мета",hist:"Слово вошло в зарубежный игровой сленг в 1990–2000-х годах как сокращение от metagaming — использования знаний об игре (её механиках, эффективных стратегиях, обновлениях) для получения преимущества. В русский язык слово пришло через игровые сообщества и интернет-среду: сначала оно употреблялось в узком кругу игроков в онлайн-играх, а затем распространилось в молодёжном сленге и стало обозначать любую актуальную, наиболее эффективную тактику — не только в игре, но и в повседневной жизни. Стоит отметить, что распространённое толкование meta как аббревиатуры «the most effective tactic available» — это народная этимология, а не настоящее происхождение слова"}
];

var DATA={},WORDS=[];
CARDS.forEach(function(c){DATA[c.word]=c;WORDS.push(c.word)});
var deck=[],known=[],again=[],cur=null,flipped=false,hist=false,busy=false;
var $=function(i){return document.getElementById(i)};
var HINT0="Нажми на колоду или на любую стопку, чтобы взять карточку";
var KEY="slang_progress_v1",SKEY="slang_sound_v1";
var snd=true,AC=null;

function store(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function load(k){try{return localStorage.getItem(k)}catch(e){return null}}
function shuffle(a){return a.sort(function(){return Math.random()-.5})}

function save(){
store(KEY,JSON.stringify({deck:cur?deck.concat([cur]):deck,known:known,again:again}));
}
function readSaved(){
var raw=load(KEY);if(!raw)return null;
try{
var s=JSON.parse(raw),seen={};
var clean=function(a){return(Array.isArray(a)?a:[]).filter(function(w){if(!DATA[w]||seen[w])return false;seen[w]=1;return true})};
var k=clean(s.known),a=clean(s.again),d=clean(s.deck);
if(!k.length&&!a.length)return null;
WORDS.forEach(function(w){if(!seen[w])d.unshift(w)});
return{deck:d,known:k,again:a};
}catch(e){return null}
}

function tone(f,d,t){
if(!snd)return;
try{
AC=AC||new(window.AudioContext||window.webkitAudioContext)();
var o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime+(t||0);
o.type="sine";o.frequency.value=f;
g.gain.setValueAtTime(.0001,n);
g.gain.exponentialRampToValueAtTime(.12,n+.01);
g.gain.exponentialRampToValueAtTime(.0001,n+d);
o.connect(g);g.connect(AC.destination);
o.start(n);o.stop(n+d+.02);
}catch(e){}
}
function winSound(){[523,659,784,1047].forEach(function(f,i){tone(f,.18,i*.12)})}

function confetti(){
if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches)return;
var c=$("fx"),x=c.getContext("2d");
c.width=window.innerWidth;c.height=window.innerHeight;
var cols=["#F5A02A","#FFD08A","#ff7ab8","#ffffff","#8f7bff"],p=[],i;
for(i=0;i<170;i++)p.push({x:c.width/2+(Math.random()-.5)*240,y:c.height*.45,vx:(Math.random()-.5)*18,vy:-Math.random()*17-4,s:Math.random()*9+6,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[Math.floor(Math.random()*cols.length)]});
var t0=null;
function f(t){
if(t0===null)t0=t;
x.clearRect(0,0,c.width,c.height);
p.forEach(function(q){q.vy+=.35;q.x+=q.vx;q.y+=q.vy;q.vx*=.99;q.r+=q.vr;x.save();x.translate(q.x,q.y);x.rotate(q.r);x.fillStyle=q.c;x.fillRect(-q.s/2,-q.s/3,q.s,q.s*.6);x.restore()});
if(t-t0<3500)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height);
}
requestAnimationFrame(f);
}

function layers(el,arr,isDeck){
el.innerHTML="";
el.style.cursor=arr.length?"pointer":"default";
if(!arr.length){el.innerHTML='<div style="width:130px;height:170px;border:2px dashed rgba(255,255,255,.3);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:15px;color:rgba(255,255,255,.6);margin-top:10px">пусто</div>';return}
var show=arr.slice(-3);
show.forEach(function(w,i){
var d=document.createElement("div");
d.style.cssText="position:absolute;width:130px;height:170px;border-radius:14px;background:#F5A02A;border:2px solid #FFD08A;left:"+(i*5)+"px;top:"+(10-i*5)+"px;display:flex;align-items:center;justify-content:center;color:#3A1B00;font-size:17px;font-weight:600;text-align:center;padding:8px;word-break:break-word";
if(i===show.length-1&&!isDeck)d.textContent=w;
el.appendChild(d)});
}
function render(){
layers($("deck"),deck,true);layers($("pk"),known,false);layers($("pa"),again,false);
$("dc").textContent=deck.length;$("kc").textContent=known.length;$("ac").textContent=again.length;
save();
}
function setHist(on){
if(on===hist)return;
hist=on;
var sh=0;
if(on){
var s=$("slot").getBoundingClientRect(),d=$("deck").getBoundingClientRect();
sh=Math.max(0,Math.min(147,Math.round(s.left-d.right-16)));
$("app").style.setProperty("--sh",sh+"px");
}
$("slot").style.transform=on?"translateX(-"+sh+"px)":"none";
$("hist").classList.toggle("on",on);
$("hbt").textContent=on?"Скрыть":"История";
}
function hideResult(){$("result").style.display="none"}
function showResult(fx){
var n=WORDS.length,k=known.length,p=k/n;
var t=p===1?"Ты — полноправный зумер":(p>=.75?"Почти зумер":(p>=.4?"Уже что-то понимаешь":"Пока ещё взрослый"));
$("rbig").textContent=k+"/"+n;
$("rttl").textContent=t;
$("rsm").textContent="Ты знаешь "+k+" из "+n+" слов";
var b=$("rbtns");b.innerHTML="";
if(again.length){
var r=document.createElement("button");r.className="btn";r.textContent="Повторить сложные ("+again.length+")";
r.onclick=function(){if(cur||busy)return;deck=shuffle(again.slice());again=[];hideResult();$("hint").textContent=HINT0;render()};
b.appendChild(r);
}
var s=document.createElement("button");s.className="btn btn2";s.textContent="Начать сначала";
s.onclick=function(){init(null)};
b.appendChild(s);
$("result").style.display="flex";
$("hint").textContent="Колода закончилась. Можно взять карточку из любой стопки";
if(fx&&p===1){confetti();winSound()}
}
function finish(fx){
if(deck.length||cur){hideResult();$("hint").textContent=cur?$("hint").textContent:HINT0;return}
showResult(fx);
}
function init(saved){
if(saved){deck=saved.deck;known=saved.known;again=saved.again}
else{deck=shuffle(WORDS.slice());known=[];again=[]}
cur=null;flipped=false;busy=false;
$("card").style.display="none";$("acts").style.visibility="hidden";hideResult();
setHist(false);
$("hint").textContent=HINT0;
render();finish(false);
}
function present(word,src){
cur=word;flipped=false;setHist(false);
hideResult();
$("inner").classList.remove("flip");
var d=DATA[cur];
$("w").textContent=cur;$("txt").textContent=d.def;$("ht").textContent=d.hist;
$("ex").textContent=d.ex||"";$("exw").style.display=d.ex?"block":"none";
var c=$("card");c.style.transition="none";c.style.transform="none";c.style.opacity="1";c.style.display="block";
var dr=src.getBoundingClientRect(),cr=c.getBoundingClientRect();
var dx=(dr.left+dr.width/2)-(cr.left+cr.width/2),dy=(dr.top+dr.height/2)-(cr.top+cr.height/2);
c.style.transform="translate("+dx+"px,"+dy+"px) scale(.45)";c.style.opacity="0";
void c.offsetWidth;
c.style.transition="transform .4s ease, opacity .3s";c.style.transform="none";c.style.opacity="1";
$("acts").style.visibility="hidden";
$("hint").textContent="Нажми на карточку, чтобы перевернуть";
tone(300,.06);
}
   
function take(kind){
if(cur||busy)return;
var arr=kind==="d"?deck:(kind==="k"?known:again);
if(!arr.length)return;
var src=$(kind==="d"?"deck":(kind==="k"?"pk":"pa"));
var w=arr.pop();
present(w,src);
render();
}
   
function flip(){
if(!cur||busy)return;
flipped=!flipped;
$("inner").classList.toggle("flip",flipped);
tone(520,.07);
if(flipped){$("acts").style.visibility="visible";$("hint").textContent="Положи карточку в одну из стопок"}
else setHist(false);
}
   
function put(kind){
if(!cur||busy||!flipped)return;
busy=true;
var wait=hist?380:0;
setHist(false);
setTimeout(function(){
var c=$("card"),t=$(kind==="k"?"pk":"pa");
var cr=c.getBoundingClientRect(),tr=t.getBoundingClientRect();
var dx=(tr.left+tr.width/2)-(cr.left+cr.width/2),dy=(tr.top+tr.height/2)-(cr.top+cr.height/2);
c.style.transition="transform .45s ease, opacity .45s";
c.style.transform="translate("+dx+"px,"+dy+"px) scale(.4)";c.style.opacity=".4";
tone(380,.09);
setTimeout(function(){
(kind==="k"?known:again).push(cur);
cur=null;busy=false;
c.style.display="none";$("acts").style.visibility="hidden";
render();finish(true);
},450);
},wait);
}
function onKey(fn){return function(ev){if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();fn()}}}
function setSnd(on){snd=on;$("snd").textContent=on?"♪ Звук: вкл":"♪ Звук: выкл";store(SKEY,on?"1":"0")}
function begin(saved){
$("head").classList.remove("big");
$("start").style.display="none";
$("play").style.display="block";
$("tools").style.display="flex";
init(saved);
}

var savedState=readSaved();
if(savedState){$("go").textContent="Продолжить";$("fresh").style.display="block"}
setSnd(load(SKEY)!=="0");
$("go").onclick=function(){begin(savedState)};
$("fresh").onclick=function(){begin(null)};
$("restart").onclick=function(){
if(busy)return;
if(known.length+again.length>0&&!window.confirm("Начать сначала? Прогресс сбросится."))return;
init(null);
};
$("snd").onclick=function(){setSnd(!snd)};
[["deck","d"],["pk","k"],["pa","a"]].forEach(function(p){
var el=$(p[0]),fn=function(){take(p[1])};
el.onclick=fn;el.onkeydown=onKey(fn);
});
$("card").onclick=flip;$("card").onkeydown=onKey(flip);
$("hb").onclick=function(e){e.stopPropagation();setHist(!hist)};
$("bk").onclick=function(){put("k")};
$("ba").onclick=function(){put("a")};
</script>
</body>
</html>
